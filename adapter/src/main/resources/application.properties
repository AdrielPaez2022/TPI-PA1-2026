server.port=8080

# Configuracion de Base de Datos (PostgreSQL por defecto)
spring.datasource.url=jdbc:postgresql://localhost:5432/recursos_humanos
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Inclusion de mensajes descriptivos en respuestas de error
server.error.include-message=always
